<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ROGERS PLAYS — Thanks For Watching</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --navy:#050c22;
    --navy2:#0a1a4a;
    --blue:#1a4dff;
    --sky:#5aa8ff;
    --red:#e62429;
    --red-bright:#ff2e4d;
    --white:#ffffff;
    --silver:#c9d6ff;
  }
  body{
    height:100vh;
    height:100dvh;
    width:100vw;
    background:#02040d;
    display:block;
    font-family:'Rajdhani',system-ui,sans-serif;
    color:white;
    overflow:hidden;
    padding:0;
    margin:0;
  }
  /* FULLSCREEN stage - fills entire screen / OBS 1920x1080 */
  .stage-wrap{
    width:100vw;
    height:100vh;
    height:100dvh;
    position:relative;
  }
  .stage{
    width:100%;height:100%;
    position:relative;
    border-radius:0;
    overflow:hidden;
    background: radial-gradient(120% 90% at 50% 0%, #14307a 0%, #0a1a4a 32%, #050c22 62%, #020610 100%);
    isolation:isolate;
  }
  /* animated bg zoom for 5s intro */
  .bg-zoom{
    position:absolute;inset:-5%;
    background:
      radial-gradient(600px 400px at 20% 15%, rgba(255,46,77,.22), transparent 60%),
      radial-gradient(700px 500px at 85% 20%, rgba(26,77,255,.35), transparent 60%),
      radial-gradient(800px 600px at 50% 110%, rgba(230,36,41,.18), transparent 60%);
    animation:bgZoom 5s ease-out both;
    z-index:0;
  }
  @keyframes bgZoom{from{transform:scale(1.18)}to{transform:scale(1)}}

  /* Captain America diagonal light beams */
  .beams{
    position:absolute;inset:-20%;
    background:
      linear-gradient(115deg, transparent 42%, rgba(230,36,41,.18) 42% 44%, transparent 44% 47%, rgba(255,255,255,.12) 47% 48.5%, transparent 48.5% 54%, rgba(90,168,255,.18) 54% 56%, transparent 56%),
      linear-gradient(115deg, transparent 62%, rgba(230,36,41,.12) 62% 64%, transparent 64%);
    transform:translateX(-8%);
    animation:beamsSlide 5s ease-out both;
    z-index:1;
  }
  @keyframes beamsSlide{from{transform:translateX(-14%);opacity:0}to{transform:translateX(0);opacity:1}}

  /* giant watermark shield rings */
  .mega-rings{
    position:absolute;left:50%;top:50%;
    width:140vmin;height:140vmin;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:repeating-radial-gradient(circle, transparent 0 68px, rgba(255,255,255,.045) 68px 69px);
    animation:megaIn 5s ease-out both;
    z-index:1;
  }
  @keyframes megaIn{from{transform:translate(-50%,-50%) scale(1.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  .mega-ring-glow{
    position:absolute;left:50%;top:50%;width:78vmin;height:78vmin;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px solid rgba(90,168,255,.25);
    box-shadow:0 0 120px rgba(26,77,255,.25) inset, 0 0 80px rgba(230,36,41,.15);
    animation:megaIn 5s ease-out both;
    z-index:1;
  }

  #stars{position:absolute;inset:0;z-index:2;pointer-events:none}

  .vignette{
    position:absolute;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(90% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .scanlines{
    position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.08;
    background:repeating-linear-gradient(to bottom, #fff 0 1px, transparent 1px 4px);
  }

  /* CONTENT */
  .content{
    position:relative;z-index:5;
    height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:3.5% 4%;
  }
  .live-badge{
    display:inline-flex;align-items:center;gap:10px;
    font-family:'Orbitron',sans-serif;
    font-size:clamp(10px,1.3vw,14px);
    letter-spacing:.35em;
    color:#dbe6ff;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    padding:.55em 1.3em .55em 1.5em;
    border-radius:100px;
    backdrop-filter:blur(8px);
    animation:dropIn .7s .1s cubic-bezier(.2,.9,.25,1.2) both;
  }
  .live-badge i{
    width:9px;height:9px;border-radius:50%;background:#ff2e4d;
    box-shadow:0 0 12px #ff2e4d;
    animation:blink 1.2s infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes dropIn{from{transform:translateY(-30px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* LOGO - your channel image */
  .shield-wrap{position:relative;margin:1.2% 0 .6%;width:clamp(130px,19vh,190px);height:clamp(130px,19vh,190px)}
  .shockwave{
    position:absolute;inset:-10%;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.8);
    animation:shock 1.3s .3s ease-out both;
  }
  .shockwave.s2{animation-delay:.45s;border-color:rgba(255,46,77,.7)}
  @keyframes shock{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
  .shield{
    width:100%;height:100%;border-radius:50%;
    position:relative;
    overflow:hidden;
    border:4px solid #fff;
    outline:4px solid var(--red);
    outline-offset:4px;
    background:#000;
    box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 55px rgba(255,46,77,.45), 0 0 90px rgba(26,77,255,.35);
    animation:shieldIn 1s .2s cubic-bezier(.18,1.4,.3,1) both;
  }
  @keyframes shieldIn{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  .shield img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .shield-shine{
    position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.45) 0%, transparent 28%);
  }

  .thanks{
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:clamp(18px,3.6vw,44px);
    letter-spacing:.18em;
    margin-top:.6em;
    display:flex;gap:.08em;
    text-shadow:0 2px 20px rgba(0,0,0,.6);
  }
  .thanks span{
    display:inline-block;opacity:0;transform:translateY(40px) rotateX(60deg);
    animation:letterUp .6s cubic-bezier(.2,.9,.3,1.2) forwards;
    background:linear-gradient(to bottom, #fff 30%, #c9d6ff 70%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  @keyframes letterUp{to{opacity:1;transform:translateY(0) rotateX(0)}}

  .channel{
    font-family:'Anton',sans-serif;
    font-size:clamp(36px,8vw,96px);
    line-height:.95;
    letter-spacing:.04em;
    margin:.05em 0 0;
    display:flex;gap:.25em;flex-wrap:wrap;justify-content:center;
    filter:drop-shadow(0 6px 24px rgba(0,0,0,.6));
    overflow:hidden;
  }
  .channel .w1,.channel .w2{
    display:inline-block;
    animation:channelUp .8s cubic-bezier(.2,.9,.2,1) both;
  }
  .channel .w1{animation-delay:1.6s;background:linear-gradient(to bottom, #fff 20%, #dbe6ff 55%, #7a90c8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .channel .w2{
    animation-delay:1.75s;
    background:linear-gradient(to bottom, #ff7a8a 0%, #ff2e4d 35%, #9b0d18 70%, #ff5a6e 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:1px rgba(255,255,255,.25);
  }
  @keyframes channelUp{from{transform:translateY(110%);opacity:0}to{transform:translateY(0);opacity:1}}

  .divider{
    display:flex;align-items:center;gap:14px;
    margin:1% 0 1.2%;
    width:min(520px,70%);
    opacity:0;animation:fadeGrow .7s 2.4s ease-out forwards;
  }
  @keyframes fadeGrow{from{opacity:0;transform:scaleX(.6)}to{opacity:1;transform:scaleX(1)}}
  .divider::before,.divider::after{content:'';height:2px;flex:1}
  .divider::before{background:linear-gradient(to right, transparent, #ff2e4d, #fff)}
  .divider::after{background:linear-gradient(to left, transparent, #1a4dff, #fff)}
  .divider svg{width:22px;height:22px;fill:#fff;filter:drop-shadow(0 0 8px rgba(255,255,255,.8))}

  .subtitle{
    font-size:clamp(13px,1.7vw,20px);
    font-weight:600;letter-spacing:.28em;
    color:#dbe6ff;
    opacity:0;animation:fadeUp .7s 2.5s ease-out forwards;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .subtitle b{color:#ff5a6e}

  .cta-row{
    display:flex;gap:clamp(10px,1.5vw,18px);
    margin-top:1.6%;
    flex-wrap:wrap;justify-content:center;
  }
  .cta{
    display:flex;align-items:center;gap:12px;
    padding:.7em 1.4em;
    border-radius:14px;
    font-weight:700;letter-spacing:.12em;
    font-size:clamp(13px,1.6vw,18px);
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    opacity:0;transform:translateY(30px) scale(.9);
    animation:cardPop .6s cubic-bezier(.2,1.4,.3,1) forwards;
    position:relative;overflow:hidden;
    min-width:170px;justify-content:center;
  }
  .cta:nth-child(1){animation-delay:2.7s}
  .cta:nth-child(2){animation-delay:2.95s}
  .cta:nth-child(3){animation-delay:3.2s;background:linear-gradient(135deg, #e62429, #9b0d18);border-color:rgba(255,255,255,.35);box-shadow:0 8px 30px rgba(230,36,41,.45)}
  @keyframes cardPop{to{opacity:1;transform:translateY(0) scale(1)}}
  .cta svg{width:22px;height:22px;fill:white;flex-shrink:0}
  .cta small{display:block;font-size:.68em;font-weight:600;letter-spacing:.22em;opacity:.8}
  .cta .txt{text-align:left;line-height:1.1}
  .cta.sub::after{
    content:'';position:absolute;top:0;left:-80%;width:60%;height:100%;
    background:linear-gradient(105deg, transparent, rgba(255,255,255,.55), transparent);
    transform:skewX(-20deg);
    animation:shine 2.2s 3.9s ease-in-out infinite;
  }
  @keyframes shine{0%{left:-80%}55%,100%{left:130%}}
  .cta.sub{animation:cardPop .6s 3.2s cubic-bezier(.2,1.4,.3,1) forwards, subPulse 1.8s 4s ease-in-out infinite}
  @keyframes subPulse{0%,100%{box-shadow:0 8px 30px rgba(230,36,41,.45);transform:scale(1)}50%{box-shadow:0 8px 45px rgba(255,46,77,.75);transform:scale(1.04)}}

  .footer{
    margin-top:1.4%;
    font-size:clamp(11px,1.3vw,15px);
    letter-spacing:.24em;color:#8ea3d6;font-weight:600;
    opacity:0;animation:fadeUp .7s 4s ease-out forwards;
  }
  .footer span{color:white}

  /* corner flags - cap stripes */
  .stripe-top,.stripe-bottom{
    position:absolute;left:0;right:0;height:8px;z-index:6;display:flex;
  }
  .stripe-top{top:0}.stripe-bottom{bottom:0}
  .stripe-top div,.stripe-bottom div{flex:1}
  .stripe-top div:nth-child(1),.stripe-bottom div:nth-child(1){background:#e62429}
  .stripe-top div:nth-child(2),.stripe-bottom div:nth-child(2){background:#fff}
  .stripe-top div:nth-child(3),.stripe-bottom div:nth-child(3){background:#1a4dff}
  .stripe-top div:nth-child(4),.stripe-bottom div:nth-child(4){background:#fff}
  .stripe-top div:nth-child(5),.stripe-bottom div:nth-child(5){background:#e62429}

  @media (max-width:700px){
    .cta{min-width:140px;padding:.6em 1em}
    .channel{font-size:13vw}
  }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="bg-zoom"></div>
    <div class="beams"></div>
    <div class="mega-rings"></div>
    <div class="mega-ring-glow"></div>
    <canvas id="stars"></canvas>
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <div class="stripe-top"><div></div><div></div><div></div><div></div><div></div></div>
    <div class="stripe-bottom"><div></div><div></div><div></div><div></div><div></div></div>

    <div class="content">
      <div class="live-badge"><i></i> LIVE ENDED</div>

      <div class="shield-wrap">
        <div class="shockwave"></div>
        <div class="shockwave s2"></div>
        <div class="shield">
          <img src="channels4_profile.jpg" alt="ROGERS PLAYS Logo" />
          <div class="shield-shine"></div>
        </div>
      </div>

      <div class="thanks" id="thanks">THANKS FOR WATCHING</div>

      <h1 class="channel">
        <span class="w1">ROGERS</span><span class="w2">PLAYS</span>
      </h1>

      <div class="divider">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8L12 2z"/></svg>
      </div>

      <div class="subtitle">PLEASE <b>LIKE</b> • <b>SHARE</b> • <b>SUBSCRIBE</b></div>

      <div class="cta-row">
        <div class="cta">
          <svg viewBox="0 0 24 24"><path d="M2 21h4V9H2v12zM23 10c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
          <div class="txt">LIKE<small>SMASH THAT BUTTON</small></div>
        </div>
        <div class="cta">
          <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
          <div class="txt">SHARE<small>WITH YOUR SQUAD</small></div>
        </div>
        <div class="cta sub">
          <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7zM1 5h15v14H1z" opacity=".95"/><path d="M23 7l-7 5 7 5V7z"/></svg>
          <div class="txt">SUBSCRIBE<small>+ HIT THE BELL 🔔</small></div>
        </div>
      </div>

      <div class="footer">@ <span>ROGERS PLAYS</span> &nbsp;•&nbsp; SEE YOU ON THE NEXT STREAM</div>
    </div>
  </div>
</div>

<script>
  // 1. Split THANKS FOR WATCHING into animated letters (stagger to finish ~1.8s)
  const thanksEl = document.getElementById('thanks');
  const text = thanksEl.textContent;
  thanksEl.textContent = '';
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? '\u00A0' : ch;
    // 0.9s start + stagger, all done by ~1.9s
    s.style.animationDelay = (0.9 + i * 0.04) + 's';
    thanksEl.appendChild(s);
  });

  // 2. Captain America particle field - red / white / blue stars + dust
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  let W, H, parts = [];
  const COLORS = ['#ffffff', '#ff2e4d', '#5aa8ff', '#c9d6ff'];

  function resize(){
    const r = stage.getBoundingClientRect();
    W = canvas.width = r.width;
    H = canvas.height = r.height;
  }
  window.addEventListener('resize', resize);
  resize();

  function spawn(n){
    for(let i=0;i<n;i++){
      parts.push({
        x: Math.random()*W,
        y: H + Math.random()*H*0.3,
        s: Math.random()*2.6+0.6,
        vy: Math.random()*1.4+0.4,
        vx: (Math.random()-.5)*0.5,
        c: COLORS[Math.floor(Math.random()*COLORS.length)],
        a: Math.random()*0.8+0.2,
        star: Math.random()<0.22,
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()-.5)*0.03
      });
    }
  }
  spawn(110);

  function drawStar(x,y,r,rot){
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a = (i*4*Math.PI)/5 - Math.PI/2;
      const ax = Math.cos(a)*r, ay = Math.sin(a)*r;
      i===0?ctx.moveTo(ax,ay):ctx.lineTo(ax,ay);
    }
    ctx.closePath();ctx.fill();
    ctx.restore();
  }

  // Burst on finale (~3.5s)
  function burst(){
    for(let i=0;i<70;i++){
      const ang = Math.random()*Math.PI*2;
      const sp = Math.random()*5+2;
      parts.push({
        x: W/2, y: H*0.38,
        s: Math.random()*3+1,
        vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp - 1,
        c: COLORS[Math.floor(Math.random()*COLORS.length)],
        a: 1, star: Math.random()<0.4,
        rot: Math.random()*6, vr: (Math.random()-.5)*0.2,
        life: 1, decay: 0.015+Math.random()*0.015, burst:true
      });
    }
  }
  setTimeout(burst, 3500);

  function tick(){
    ctx.clearRect(0,0,W,H);
    parts.forEach(p=>{
      if(p.burst){
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.vx*=0.98;
        p.life-=p.decay; p.a=Math.max(0,p.life); p.rot+=p.vr;
      } else {
        p.y-=p.vy; p.x+=p.vx + Math.sin(p.y*0.01)*0.2; p.rot+=p.vr;
        if(p.y<-20){p.y=H+20;p.x=Math.random()*W;}
      }
      ctx.globalAlpha=p.a;
      ctx.fillStyle=p.c;
      if(p.star) drawStar(p.x,p.y,p.s*2.2,p.rot);
      else {ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();}
    });
    parts = parts.filter(p=>!p.burst || p.life>0);
    // keep ambient topped up
    if(parts.filter(p=>!p.burst).length<90) spawn(5);
    ctx.globalAlpha=1;
    requestAnimationFrame(tick);
  }
  tick();

  // 3. Shortcuts: R = replay, F / double-click = fullscreen
  window.addEventListener('keydown', e=>{
    if(e.key.toLowerCase()==='r') location.reload();
    if(e.key.toLowerCase()==='f'){
      if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen();
    }
  });
  // double-click to go true fullscreen
  window.addEventListener('dblclick', ()=>{
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  });
</script>
</body>
</html>
