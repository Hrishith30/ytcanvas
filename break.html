<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ROGERS PLAYS — Break</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#050c22;--navy2:#0a1a4a;--blue:#1a4dff;--sky:#5aa8ff;--red:#e62429;--red-bright:#ff2e4d;--white:#fff;--silver:#c9d6ff}
body{height:100vh;height:100dvh;width:100vw;background:#02040d;font-family:'Rajdhani',sans-serif;color:#fff;overflow:hidden}
.stage-wrap{width:100vw;height:100vh;height:100dvh;position:relative}
.stage{width:100%;height:100%;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#14307a 0%,#0a1a4a 32%,#050c22 62%,#020610 100%);isolation:isolate}
.bg-zoom{position:absolute;inset:-5%;background:radial-gradient(600px 400px at 20% 15%,rgba(255,46,77,.22),transparent 60%),radial-gradient(700px 500px at 85% 20%,rgba(26,77,255,.35),transparent 60%),radial-gradient(800px 600px at 50% 110%,rgba(230,36,41,.18),transparent 60%);animation:bgZoom 5s ease-out both;z-index:0}
@keyframes bgZoom{from{transform:scale(1.18)}to{transform:scale(1)}}
.beams{position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 42%,rgba(230,36,41,.18) 42% 44%,transparent 44% 47%,rgba(255,255,255,.12) 47% 48.5%,transparent 48.5% 54%,rgba(90,168,255,.18) 54% 56%,transparent 56%),linear-gradient(115deg,transparent 62%,rgba(230,36,41,.12) 62% 64%,transparent 64%);animation:beamsSlide 5s ease-out both;z-index:1}
@keyframes beamsSlide{from{transform:translateX(-14%);opacity:0}to{transform:translateX(0);opacity:1}}
.mega-rings{position:absolute;left:50%;top:50%;width:140vmin;height:140vmin;transform:translate(-50%,-50%);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 68px,rgba(255,255,255,.045) 68px 69px);animation:megaIn 5s ease-out both;z-index:1}
.mega-ring-glow{position:absolute;left:50%;top:50%;width:78vmin;height:78vmin;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(90,168,255,.25);box-shadow:0 0 120px rgba(26,77,255,.25) inset,0 0 80px rgba(230,36,41,.15);animation:megaIn 5s ease-out both;z-index:1}
@keyframes megaIn{from{transform:translate(-50%,-50%) scale(1.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#stars{position:absolute;inset:0;z-index:2;pointer-events:none}
.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(90% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
.scanlines{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.08;background:repeating-linear-gradient(to bottom,#fff 0 1px,transparent 1px 4px)}
.content{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3.5% 4%}
.live-badge{display:inline-flex;align-items:center;gap:10px;font-family:'Orbitron',sans-serif;font-size:clamp(10px,1.3vw,14px);letter-spacing:.35em;color:#dbe6ff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);padding:.55em 1.3em .55em 1.5em;border-radius:100px;backdrop-filter:blur(8px);animation:dropIn .7s .1s cubic-bezier(.2,.9,.25,1.2) both}
.live-badge i{width:9px;height:9px;border-radius:50%;background:#ff2e4d;box-shadow:0 0 12px #ff2e4d;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes dropIn{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.shield-wrap{position:relative;margin:1.2% 0 .6%;width:clamp(120px,17vh,172px);height:clamp(120px,17vh,172px)}
.shockwave{position:absolute;inset:-10%;border-radius:50%;border:3px solid rgba(255,255,255,.8);animation:shock 1.3s .3s ease-out both}
.shockwave.s2{animation-delay:.45s;border-color:rgba(255,46,77,.7)}
@keyframes shock{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.shield{width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;border:4px solid #fff;outline:4px solid var(--red);outline-offset:4px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 55px rgba(255,46,77,.45),0 0 90px rgba(26,77,255,.35);animation:shieldIn 1s .2s cubic-bezier(.18,1.4,.3,1) both}
@keyframes shieldIn{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.shield img{width:100%;height:100%;object-fit:cover;display:block}
.shield-shine{position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.45) 0%,transparent 28%)}
.eyebrow{font-family:'Orbitron',sans-serif;font-weight:800;font-size:clamp(16px,3vw,38px);letter-spacing:.22em;margin-top:.7em;display:flex;gap:.08em;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.eyebrow span{display:inline-block;opacity:0;transform:translateY(40px) rotateX(60deg);animation:letterUp .6s cubic-bezier(.2,.9,.3,1.2) forwards;background:linear-gradient(to bottom,#fff 30%,#c9d6ff 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes letterUp{to{opacity:1;transform:none}}
.break-big{font-family:'Anton',sans-serif;font-size:clamp(70px,15vw,180px);line-height:.95;letter-spacing:.05em;margin:.02em 0 0;display:flex;justify-content:center;filter:drop-shadow(0 6px 24px rgba(0,0,0,.6));overflow:hidden}
.break-big span{display:inline-block;animation:channelUp .8s cubic-bezier(.2,.9,.2,1) both;background:linear-gradient(to bottom,#ff7a8a 0%,#ff2e4d 35%,#9b0d18 70%,#ff5a6e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.25)}
@keyframes channelUp{from{transform:translateY(110%);opacity:0}to{transform:none;opacity:1}}
.divider{display:flex;align-items:center;gap:14px;margin:1% 0 1.1%;width:min(520px,70%);opacity:0;animation:fadeGrow .7s 2.2s ease-out forwards}
@keyframes fadeGrow{from{opacity:0;transform:scaleX(.6)}to{opacity:1;transform:scaleX(1)}}
.divider::before,.divider::after{content:'';height:2px;flex:1}
.divider::before{background:linear-gradient(to right,transparent,#ff2e4d,#fff)}
.divider::after{background:linear-gradient(to left,transparent,#1a4dff,#fff)}
.divider svg{width:22px;height:22px;fill:#fff;filter:drop-shadow(0 0 8px rgba(255,255,255,.8))}
.subtitle{font-size:clamp(13px,1.7vw,20px);font-weight:600;letter-spacing:.28em;color:#dbe6ff;opacity:0;animation:fadeUp .7s 2.3s ease-out forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.subtitle b{color:#ff5a6e}
.dots{margin-top:1.6%;display:flex;gap:14px;opacity:0;animation:fadeUp .7s 2.6s ease-out forwards}
.dots i{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.3;animation:dot 1.5s infinite}
.dots i:nth-child(2){animation-delay:.2s;background:#ff5a6e}.dots i:nth-child(3){animation-delay:.4s;background:#5aa8ff}
@keyframes dot{50%{opacity:1;transform:scale(1.3);box-shadow:0 0 14px currentColor}}
.footer{margin-top:1.3%;font-size:clamp(11px,1.3vw,15px);letter-spacing:.24em;color:#8ea3d6;font-weight:600;opacity:0;animation:fadeUp .7s 2.8s ease-out forwards}
.footer span{color:#fff}
.stripe-top,.stripe-bottom{position:absolute;left:0;right:0;height:8px;z-index:6;display:flex}
.stripe-top{top:0}.stripe-bottom{bottom:0}
.stripe-top div,.stripe-bottom div{flex:1}
.stripe-top div:nth-child(1),.stripe-bottom div:nth-child(1){background:#e62429}
.stripe-top div:nth-child(2),.stripe-bottom div:nth-child(2){background:#fff}
.stripe-top div:nth-child(3),.stripe-bottom div:nth-child(3){background:#1a4dff}
.stripe-top div:nth-child(4),.stripe-bottom div:nth-child(4){background:#fff}
.stripe-top div:nth-child(5),.stripe-bottom div:nth-child(5){background:#e62429}
</style>
</head>
<body>
<div class="stage-wrap">
<div class="stage" id="stage">
<div class="bg-zoom"></div>
<div class="beams"></div>
<div class="mega-rings"></div>
<div class="mega-ring-glow"></div>
<canvas id="stars"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>
<div class="stripe-top"><div></div><div></div><div></div><div></div><div></div></div>
<div class="stripe-bottom"><div></div><div></div><div></div><div></div><div></div></div>
<div class="content">
<div class="live-badge"><i></i>LIVE&nbsp;•&nbsp;ON BREAK</div>
<div class="shield-wrap">
<div class="shockwave"></div><div class="shockwave s2"></div>
<div class="shield"><img src="channels4_profile.jpg" alt="ROGERS PLAYS Logo" onerror="this.style.display='none'"><div class="shield-shine"></div></div>
</div>
<div class="eyebrow" id="eyebrow">BE RIGHT BACK</div>
<h1 class="break-big" id="breakBig">BREAK</h1>
<div class="divider"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8L12 2z"/></svg></div>
<div class="subtitle">STREAM RESUMES <b>SHORTLY</b> • STAY TUNED</div>
<div class="dots"><i></i><i></i><i></i></div>
<div class="footer">@ <span>ROGERS PLAYS</span> &nbsp;•&nbsp; GRAB A SNACK</div>
</div>
</div>
</div>
<script>
var eb=document.getElementById('eyebrow'),t=eb.textContent;eb.textContent='';
[...t].forEach((ch,i)=>{var s=document.createElement('span');s.textContent=ch===' '?'\u00A0':ch;s.style.animationDelay=(0.9+i*0.045)+'s';eb.appendChild(s);});
var bb=document.getElementById('breakBig'),bt=bb.textContent;bb.textContent='';
[...bt].forEach((ch,i)=>{var s=document.createElement('span');s.textContent=ch;s.style.animationDelay=(1.5+i*0.07)+'s';bb.appendChild(s);});
var canvas=document.getElementById('stars'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),W,H,parts=[];
var COLORS=['#ffffff','#ff2e4d','#5aa8ff','#c9d6ff'];
function resize(){var r=stage.getBoundingClientRect();W=canvas.width=r.width;H=canvas.height=r.height;}
window.addEventListener('resize',resize);resize();
function spawn(n){for(var i=0;i<n;i++){parts.push({x:Math.random()*W,y:H+Math.random()*H*0.3,s:Math.random()*2.6+0.6,vy:Math.random()*1.4+0.4,vx:(Math.random()-.5)*0.5,c:COLORS[Math.floor(Math.random()*COLORS.length)],a:Math.random()*0.8+0.2,star:Math.random()<0.22,rot:Math.random()*6,vr:(Math.random()-.5)*0.03});}}
spawn(110);
function drawStar(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();for(var i=0;i<5;i++){var a=(i*4*Math.PI)/5-Math.PI/2;var ax=Math.cos(a)*r,ay=Math.sin(a)*r;i===0?ctx.moveTo(ax,ay):ctx.lineTo(ax,ay);}ctx.closePath();ctx.fill();ctx.restore();}
function tick(){ctx.clearRect(0,0,W,H);parts.forEach(p=>{p.y-=p.vy;p.x+=p.vx+Math.sin(p.y*0.01)*0.2;p.rot+=p.vr;if(p.y<-20){p.y=H+20;p.x=Math.random()*W;}ctx.globalAlpha=p.a;ctx.fillStyle=p.c;if(p.star)drawStar(p.x,p.y,p.s*2.2,p.rot);else{ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();}});if(parts.length<90)spawn(5);ctx.globalAlpha=1;requestAnimationFrame(tick);}
tick();
window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')location.reload();if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}});
window.addEventListener('dblclick',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();});
</script>
</body>
</html>
